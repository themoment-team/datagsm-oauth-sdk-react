name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write # npm Trusted Publisher(OIDC) 인증과 provenance 서명에 필요

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # GitHub에서 pre-release로 표시한 릴리즈는 배포하지 않는다
    if: github.event_name != 'release' || !github.event.release.prerelease
    runs-on: ubuntu-latest
    steps:
      # 수동 실행은 Actions 탭에서 아무 브랜치나 고를 수 있으므로 main에서만 허용한다
      - name: Allow manual runs only on main
        if: github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::수동 배포는 main 브랜치에서만 실행할 수 있습니다. (현재: $REF)"
          exit 1

      # release 이벤트는 기본으로 태그 커밋을 받지만, 태그 기준으로 배포한다는 의도를 명시한다
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.ref }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org

      # Trusted Publishing은 npm 11.5.1 이상에서만 동작한다
      - run: npm install -g npm@11

      - run: pnpm install --frozen-lockfile

      - name: Read package name and version
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      # 릴리즈 태그(예: 2.0.0)와 package.json 버전이 다르면 잘못된 버전이 배포되므로 막는다
      - name: Check release tag matches package version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if [ "$TAG" != "$VERSION" ]; then
            echo "::error::릴리즈 태그($TAG)와 package.json 버전($VERSION)이 다릅니다."
            exit 1
          fi

      # 같은 버전은 다시 배포할 수 없으므로, 이미 있으면 실패 대신 건너뛴다
      - name: Check whether version is already published
        id: published
        env:
          NAME: ${{ steps.pkg.outputs.name }}
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::$NAME@$VERSION 은(는) 이미 배포되어 건너뜁니다."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.published.outputs.exists == 'false'
        run: pnpm lint && pnpm type-check && pnpm test

      # Trusted Publishing(OIDC)은 npm CLI가 지원하므로 배포만 npm으로 한다.
      # 빌드는 prepublishOnly(pnpm run build)가 pnpm으로 실행한다.
      # 2.1.0-beta.1처럼 pre-release 버전이면 latest가 아니라 next 태그로 올린다.
      - if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.pkg.outputs.version }}
        run: |
          DIST_TAG=latest
          case "$VERSION" in *-*) DIST_TAG=next ;; esac
          npm publish --access public --provenance --tag "$DIST_TAG"
